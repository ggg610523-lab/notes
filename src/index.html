<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data:;">
  <title>Notes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="root">
    <div class="titlebar">
      <button class="hamburger-btn" id="hamburger-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h16"/></svg>
      </button>
      <div class="titlebar-drag">
        <span class="titlebar-label">Notes</span>
      </div>
      <div class="win-controls">
        <button class="wc-btn wc-btn-min" id="btn-minimize" title="Minimize">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="10" height="10"><path d="M5 12h14"/></svg>
        </button>
        <button class="wc-btn wc-btn-max" id="btn-maximize" title="Maximize">
          <svg class="ico-max" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="10" height="10"><rect width="18" height="18" x="3" y="3" rx="2"/></svg>
          <svg class="ico-restore" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="10" height="10"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
        </button>
        <button class="wc-btn wc-btn-close" id="btn-close" title="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="10" height="10"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
    </div>

    <div id="app">
      <aside id="sidebar">
        <div class="sidebar-header">
          <span class="sidebar-title">Folders</span>
        </div>
        <nav class="sidebar-nav">
          <div class="nav-group">
            <button class="nav-item active" data-view="all">
              <span class="nav-icon-wrap yellow-bg"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg></span>
              <span>All Notes</span>
              <span class="nav-badge" id="all-count">0</span>
            </button>
            <button class="nav-item" data-view="favorites">
              <span class="nav-icon-wrap pink-bg"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"/></svg></span>
              <span>Favorites</span>
              <span class="nav-badge" id="favorites-count">0</span>
            </button>
            <button class="nav-item" data-view="recent">
              <span class="nav-icon-wrap blue-bg"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></span>
              <span>Recently Deleted</span>
              <span class="nav-badge" id="trash-count">0</span>
            </button>
          </div>
          <div class="nav-group">
            <div class="nav-group-label">Tags</div>
            <div id="tags-list"></div>
            <button class="nav-item nav-item-add" id="add-tag-btn">
              <span class="nav-icon-wrap gray-bg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><path d="M5 12h14"/><path d="M12 5v14"/></svg></span>
              <span>New Tag</span>
            </button>
          </div>
          <div class="nav-group">
            <button class="nav-item" id="dark-mode-toggle">
              <span class="nav-icon-wrap indigo-bg"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg></span>
              <span>Dark Mode</span>
              <span class="nav-badge" id="dark-mode-badge">Off</span>
            </button>
          </div>
        </nav>
      </aside>

      <main id="main-content">
        <div id="notes-list-panel">
          <div id="toolbar">
            <h1 id="view-title">All Notes</h1>
            <div class="toolbar-actions">
              <div class="search-bar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
                <input type="text" id="search-input" placeholder="Search">
              </div>
              <button class="toolbar-btn" id="load-note-btn" title="Load from backup">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2"/><path d="m9 14 3 3 3-3"/><path d="M12 17V9"/></svg>
              </button>
              <button class="toolbar-btn" id="new-note-btn" title="New Note">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>
              </button>
            </div>
          </div>
          <div id="notes-container">
            <div id="empty-notes" class="empty-state">
              <div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="64" height="64"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg></div>
              <h2>No Notes</h2>
              <p>Create a new note to get started</p>
            </div>
            <div id="notes-list"></div>
          </div>
        </div>

        <div id="editor-panel" class="hidden">
          <div id="editor-toolbar">
            <button class="editor-back-btn" id="editor-back-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="m15 18-6-6 6-6"/></svg><span>Notes</span></button>
            <div class="editor-actions">
              <button class="editor-action-btn" id="editor-favorite-btn" title="Favorite"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16" id="editor-fav-icon"><path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"/></svg></button>
              <button class="editor-action-btn danger" id="editor-delete-btn" title="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
            </div>
          </div>
          <div id="editor-content">
            <div id="editor-title" contenteditable="true" placeholder="Title"></div>
            <div id="editor-date"></div>
            <div id="editor-tags">
              <div id="editor-tags-list"></div>
              <button class="editor-add-tag-btn" id="editor-add-tag-btn" title="Add tag">+</button>
              <div class="tag-dropdown hidden" id="tag-dropdown"></div>
            </div>
            <div id="editor-body" contenteditable="true" placeholder="Start writing..."></div>
          </div>
        </div>
      </main>

      <div class="sidebar-overlay" id="sidebar-overlay"></div>
    </div>
  </div>

  <div class="dialog-overlay hidden" id="dialog-overlay">
    <div class="dialog" id="dialog">
      <div class="dialog-title" id="dialog-title">New Tag</div>
      <input class="dialog-input" id="dialog-input" type="text" placeholder="Tag name">
      <div class="dialog-actions">
        <button class="dialog-btn dialog-btn-cancel" id="dialog-cancel">Cancel</button>
        <button class="dialog-btn dialog-btn-confirm" id="dialog-confirm">Create</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
